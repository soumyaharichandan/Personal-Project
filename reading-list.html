<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading list — Soumya Ranjan Harichandan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .learn-card { display: flex; flex-direction: column; }
    .book-cover-wrap {
      width: 100%; display: flex; justify-content: center;
      margin-bottom: 14px; min-height: 190px; align-items: flex-end;
    }
    .book-cover {
      width: auto; max-width: 132px; height: 190px;
      object-fit: cover; border-radius: 3px;
      box-shadow: 2px 4px 12px rgba(0,0,0,.18);
      display: block;
    }
    .book-cover-placeholder {
      width: 132px; height: 190px; border-radius: 3px;
      background: var(--surface, #f4f4f4);
      border: 1px solid var(--line, #e0e0e0);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; color: var(--muted, #999);
    }
    @media (prefers-color-scheme: dark) {
      .book-cover-placeholder { background: #1e1e1e; border-color: #333; }
    }
    [data-theme="dark"] .book-cover-placeholder { background: #1e1e1e; border-color: #333; }
    .lib-grid.loading { min-height: 200px; display: flex; align-items: center; justify-content: center; }
    .lib-loading-text { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a href="index.html" class="logo">Soumya <span>Harichandan</span></a>
      <nav>
        <a href="work.html">Work</a>
        <a href="notes.html">Notebooks</a>
        <a href="about.html">About</a>
        <a href="index.html#contact">Contact</a>
        <div class="burger-menu">
          <button type="button" class="burger-btn" id="burgerBtn" aria-haspopup="true" aria-expanded="false" aria-label="More">☰</button>
          <div class="burger-panel" id="burgerPanel" hidden>
            <a href="lab.html">Lab</a>
            <a href="learning.html">Learning</a>
            <a href="reading-list.html">Reading list</a>
          </div>
        </div>
        <button id="theme" aria-label="Toggle theme">☾</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="cs-hero reveal">
      <p class="eyebrow">From Bookshelf</p>
      <h1 class="h2-size">Reading List</h1>
      <p class="dim" style="max-width:520px;margin-top:12px">49 books tracked on Goodreads — design, psychology, business, and the occasional fiction.</p>
    </div>

    <!-- Filter bar -->
    <div class="sk-filter-bar reveal" style="margin-top:28px">
      <div class="sk-filter-group">
        <input type="search" class="sk-search" id="libSearch" placeholder="Search books…" aria-label="Search books">
      </div>
      <div class="sk-filter-group">
        <button type="button" class="sk-filter-pill" id="libShelfBtn" aria-expanded="false" aria-haspopup="true">
          <span id="libShelfLabel">Shelf</span><span class="sk-filter-caret">⌄</span>
        </button>
        <div class="sk-filter-popover" id="libShelfPopover" hidden>
          <label class="sk-filter-option"><input type="radio" name="libShelf" value="all" checked><span>All shelves</span></label>
          <label class="sk-filter-option"><input type="radio" name="libShelf" value="read"><span>Read</span></label>
          <label class="sk-filter-option"><input type="radio" name="libShelf" value="reading"><span>Currently reading</span></label>
          <label class="sk-filter-option"><input type="radio" name="libShelf" value="to-read"><span>Want to read</span></label>
        </div>
      </div>
      <div class="sk-filter-group">
        <button type="button" class="sk-filter-pill" id="libCatBtn" aria-expanded="false" aria-haspopup="true">
          <span id="libCatLabel">Category</span><span class="sk-filter-caret">⌄</span>
        </button>
        <div class="sk-filter-popover" id="libCatPopover" hidden></div>
      </div>
      <button type="button" class="sk-filter-clear" id="libFilterClear" hidden>✕ Clear</button>
    </div>

    <div class="learn lib-grid loading" style="margin-top:32px" id="libGrid">
      <p class="lib-loading-text">Loading books…</p>
    </div>

    <div class="sk-empty" id="libEmpty">
      <svg class="sk-empty-icon" width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="17" cy="17" r="11" stroke="currentColor" stroke-width="2"/>
        <line x1="25.2" y1="25.2" x2="34" y2="34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="12.5" y1="17" x2="21.5" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p>No books match that filter.</p>
    </div>

    <div class="pg-bar" id="libPgBar" hidden>
      <label class="pg-size"><span>Show</span>
        <select id="libPerPage" aria-label="Items per page">
          <option value="4" selected>4</option>
          <option value="8">8</option>
          <option value="16">16</option>
        </select>
      </label>
      <nav class="pg-pagination" id="libPagination" aria-label="Pagination" hidden></nav>
    </div>
  </main>

  <footer class="site-foot"><div class="wrap"><span>© <span id="yr"></span> Soumya Ranjan Harichandan</span><span>Designed &amp; built by me</span></div></footer>
  <script src="script.js"></script>
  <script>
    // Reading list is data-driven: all book records live in books.json
    // (schema: id, title, author, publisher, isbn, cover, shelf, progress,
    // rating, note, tags[]). This fetches that file once, then every filter
    // change and pagination "page" click re-queries the in-memory array and
    // re-renders just the current page's cards from scratch.
    (function () {
      const grid = document.getElementById('libGrid');
      const searchEl = document.getElementById('libSearch');
      const shelfBtn = document.getElementById('libShelfBtn');
      const shelfLabel = document.getElementById('libShelfLabel');
      const shelfPopover = document.getElementById('libShelfPopover');
      const catBtn = document.getElementById('libCatBtn');
      const catLabel = document.getElementById('libCatLabel');
      const catPopover = document.getElementById('libCatPopover');
      const clearBtn = document.getElementById('libFilterClear');
      const emptyEl = document.getElementById('libEmpty');
      const pgBar = document.getElementById('libPgBar');
      const perPageSelect = document.getElementById('libPerPage');
      const paginationEl = document.getElementById('libPagination');

      if (!grid) return;

      const PP_KEY = 'pgPerPage:reading-list:v2';
      let PER_PAGE = 4;
      try { const s = parseInt(localStorage.getItem(PP_KEY), 10); if (s) PER_PAGE = s; } catch (e) {}

      let allBooks = [];
      let shelf = 'all';
      let selectedCats = new Set();
      let currentFiltered = [];

      const TAB_COLOR = { read: '#f0a93f', reading: '#4a9eff', 'to-read': '#9b8ea8' };
      const SHELF_LABEL_MAP = { all: 'Shelf', read: 'Read', reading: 'Reading', 'to-read': 'Want to read' };

      function stateLabel(book) {
        if (book.shelf === 'reading') return '◎ reading';
        if (book.shelf === 'to-read') return '○ up next';
        return '✓ read';
      }
      function progressSmallLabel(book) {
        if (book.shelf === 'to-read') return 'up next';
        if (book.rating) return '★'.repeat(book.rating);
        return '✓ read';
      }

      function renderCard(book) {
        const art = document.createElement('article');
        art.className = 'learn-card';
        art.dataset.shelf = book.shelf;
        art.dataset.cat = book.tags.join(',');
        art.style.setProperty('--tab', TAB_COLOR[book.shelf] || '#9b8ea8');

        const coverWrap = document.createElement('div');
        coverWrap.className = 'book-cover-wrap';
        if (book.isbn) {
          const img = document.createElement('img');
          img.className = 'book-cover';
          img.alt = book.title;
          img.loading = 'lazy';
          img.src = book.cover;
          img.onerror = () => { coverWrap.innerHTML = '<div class="book-cover-placeholder">📖</div>'; };
          img.onload = () => { if (img.naturalWidth <= 1) coverWrap.innerHTML = '<div class="book-cover-placeholder">📖</div>'; };
          coverWrap.appendChild(img);
        } else {
          coverWrap.innerHTML = '<div class="book-cover-placeholder">📖</div>';
        }
        art.appendChild(coverWrap);

        const top = document.createElement('div');
        top.className = 'learn-top';
        top.innerHTML = `<span class="learn-kind">Book</span><span class="learn-state next">${stateLabel(book)}</span>`;
        art.appendChild(top);

        const h3 = document.createElement('h3');
        h3.textContent = book.title;
        art.appendChild(h3);

        const src = document.createElement('p');
        src.className = 'learn-src';
        src.textContent = [book.author, book.publisher].filter(Boolean).join(' · ');
        art.appendChild(src);

        const prog = document.createElement('div');
        prog.className = 'learn-progress';
        prog.style.setProperty('--p', book.progress + '%');
        prog.setAttribute('role', 'img');
        prog.setAttribute('aria-label', book.shelf === 'to-read' ? 'Not started' : 'Completed');
        prog.innerHTML = `<span></span><small>${progressSmallLabel(book)}</small>`;
        art.appendChild(prog);

        if (book.note) {
          const note = document.createElement('p');
          note.className = 'learn-note';
          note.innerHTML = `<b>note:</b> ${book.note}`;
          art.appendChild(note);
        }

        const stack = document.createElement('div');
        stack.className = 'stack';
        stack.innerHTML = book.tags.map(t => `<span>${t}</span>`).join('');
        art.appendChild(stack);

        return art;
      }

      function renderCategoryPopover() {
        const cats = new Set();
        allBooks.forEach(b => b.tags.forEach(t => cats.add(t)));
        catPopover.innerHTML = [...cats].sort().map(c =>
          `<label class="sk-filter-option"><input type="checkbox" value="${c}"><span>${c}</span></label>`
        ).join('');
        catPopover.querySelectorAll('input[type=checkbox]').forEach(cb => {
          cb.addEventListener('change', () => {
            if (cb.checked) selectedCats.add(cb.value); else selectedCats.delete(cb.value);
            query();
          });
        });
      }

      // "query": re-filter the in-memory dataset by current search/shelf/category,
      // then hand the result to the pagination control, which triggers renderPage
      // for whichever page is active (defaulting to page 1 on a filter change).
      function query() {
        const term = (searchEl ? searchEl.value : '').toLowerCase().trim();
        currentFiltered = allBooks.filter(book => {
          const matchTerm = !term || book.title.toLowerCase().includes(term) || book.author.toLowerCase().includes(term);
          const matchShelf = shelf === 'all' || book.shelf === shelf;
          const matchCat = selectedCats.size === 0 || book.tags.some(t => selectedCats.has(t));
          return matchTerm && matchShelf && matchCat;
        });

        emptyEl.classList.toggle('show', currentFiltered.length === 0);
        grid.classList.toggle('sk-shelf-hidden', currentFiltered.length === 0);
        clearBtn.hidden = shelf === 'all' && selectedCats.size === 0 && (!searchEl || searchEl.value === '');
        pgBar.hidden = currentFiltered.length === 0;
        shelfLabel.textContent = SHELF_LABEL_MAP[shelf] || 'Shelf';
        catLabel.textContent = selectedCats.size === 0 ? 'Category' : [...selectedCats].join(', ');

        pagination.setCount(currentFiltered.length, PER_PAGE);
      }

      // "renderPage": this is the function that fires on every Prev/Next/page-number
      // click — it slices the already-fetched dataset to just the requested page
      // and rebuilds only those cards in the DOM.
      function renderPage(page) {
        grid.classList.remove('loading');
        grid.innerHTML = '';
        const start = (page - 1) * PER_PAGE;
        const pageItems = currentFiltered.slice(start, start + PER_PAGE);
        pageItems.forEach(book => grid.appendChild(renderCard(book)));
      }

      const pagination = skPagination(paginationEl, renderPage);

      // Shelf radio
      shelfBtn.addEventListener('click', () => {
        const open = !shelfPopover.hidden;
        shelfPopover.hidden = open;
        catPopover.hidden = true;
        shelfBtn.setAttribute('aria-expanded', String(!open));
        catBtn.setAttribute('aria-expanded', 'false');
      });
      shelfPopover.querySelectorAll('input[type=radio]').forEach(r => {
        r.addEventListener('change', () => { shelf = r.value; query(); });
      });

      // Category checkboxes (populated after fetch)
      catBtn.addEventListener('click', () => {
        const open = !catPopover.hidden;
        catPopover.hidden = open;
        shelfPopover.hidden = true;
        catBtn.setAttribute('aria-expanded', String(!open));
        shelfBtn.setAttribute('aria-expanded', 'false');
      });

      // Search
      searchEl.addEventListener('input', query);

      // Clear
      clearBtn.addEventListener('click', () => {
        shelf = 'all';
        selectedCats.clear();
        searchEl.value = '';
        shelfPopover.querySelectorAll('input[type=radio]').forEach(r => { r.checked = r.value === 'all'; });
        catPopover.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = false; });
        query();
      });

      // Close popovers on outside click
      document.addEventListener('click', e => {
        if (!shelfBtn.contains(e.target) && !shelfPopover.contains(e.target)) { shelfPopover.hidden = true; shelfBtn.setAttribute('aria-expanded', 'false'); }
        if (!catBtn.contains(e.target) && !catPopover.contains(e.target)) { catPopover.hidden = true; catBtn.setAttribute('aria-expanded', 'false'); }
      });

      if (perPageSelect) {
        perPageSelect.value = String(PER_PAGE);
        perPageSelect.addEventListener('change', () => {
          PER_PAGE = parseInt(perPageSelect.value, 10) || PER_PAGE;
          try { localStorage.setItem(PP_KEY, String(PER_PAGE)); } catch (e) {}
          query();
        });
      }

      // Fetch the dataset once, then render
      fetch('books.json')
        .then(r => r.json())
        .then(data => {
          allBooks = data;
          grid.classList.remove('loading');
          renderCategoryPopover();
          query();
        })
        .catch(() => {
          grid.classList.remove('loading');
          grid.innerHTML = '<p class="lib-loading-text">Couldn\'t load the reading list — try refreshing.</p>';
        });
    })();
  </script>
</body>
</html>
