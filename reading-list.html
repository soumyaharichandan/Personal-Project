  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a href="index.html" class="logo">Soumya <span>Harichandan</span></a>
      <nav>
        <a href="work.html">Work</a>
        <a href="notes.html">Notebooks</a>
        <a href="about.html">About</a>
        <a href="index.html#contact">Contact</a>
        <div class="burger-menu">
          <button type="button" class="burger-btn" id="burgerBtn" aria-haspopup="true" aria-expanded="false" aria-label="More">☰</button>
          <div class="burger-panel" id="burgerPanel" hidden>
            <a href="lab.html">Lab</a>
            <a href="learning.html">Learning</a>
            <a href="reading-list.html">Reading list</a>
          </div>
        </div>
        <button id="theme" aria-label="Toggle theme">☾</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="cs-hero reveal">
      <p class="eyebrow">From Bookshelf</p>
      <h1 class="h2-size">Recent Reading List</h1>
    </div>
    <div class="learn lib-grid reveal" style="margin-top:32px;padding-bottom:96px">
      <article class="learn-card" style="--tab:#f0a93f">
        <div class="learn-top"><span class="learn-kind">Book</span><span class="learn-state next">○ up next</span></div>
        <h3>A topic you're starting next</h3>
        <p class="learn-src">Source · book or author</p>
        <div class="learn-progress" style="--p:8%" role="img" aria-label="Just started"><span></span><small>just started</small></div>
        <p class="learn-note"><b>why:</b> one line on why you picked this up.</p>
        <div class="stack"><span>TAG</span><span>TAG</span></div>
      </article>
    </div>
    <div class="pg-bar" id="libPgBar">
      <label class="pg-size"><span>Show</span>
        <select id="libPerPage" aria-label="Items per page">
          <option value="1">1 (all)</option>
          <option value="2">2</option>
          <option value="5">5</option>
        </select>
      </label>
      <nav class="pg-pagination" id="libPagination" aria-label="Pagination" hidden></nav>
    </div>
  </main>
  <footer class="site-foot"><div class="wrap"><span>© <span id="yr"></span> Soumya Ranjan Harichandan</span><span>Designed &amp; built by me</span></div></footer>
  <script src="script.js"></script>
  <script>
    (function () {
      const items = [...document.querySelectorAll('.lib-grid > .learn-card')];
      const pgBar = document.getElementById('libPgBar');
      const perPageSelect = document.getElementById('libPerPage');
      const PP_KEY = 'pgPerPage:reading-list';
      let PER_PAGE = 1;
      try { const saved = parseInt(localStorage.getItem(PP_KEY), 10); if (saved) PER_PAGE = saved; } catch (e) {}
      function render() {
        if (pgBar) pgBar.hidden = items.length === 0;
        pagination.setCount(items.length, PER_PAGE);
      }
      const pagination = skPagination(document.getElementById('libPagination'), page => {
        items.forEach((el, i) => el.classList.toggle('pg-hidden', i < (page - 1) * PER_PAGE || i >= page * PER_PAGE));
      });
      if (perPageSelect) {
        perPageSelect.value = String(PER_PAGE);
        perPageSelect.addEventListener('change', () => {
          PER_PAGE = parseInt(perPageSelect.value, 10) || PER_PAGE;
          try { localStorage.setItem(PP_KEY, String(PER_PAGE)); } catch (e) {}
          render();
        });
      }
      render();
    })();
  </script>
</body>
</html>
