<body>
  <header class="site">
    <div class="wrap">
      <a href="index.html" class="logo">Soumya <span>Harichandan</span></a>
      <nav>
        <a href="work.html">Work</a>
        <a href="notes.html">Notebooks</a>

        <div class="burger-menu">
          <button type="button" class="burger-btn" id="burgerBtn" aria-haspopup="true" aria-expanded="false" aria-label="More">☰</button>

  <main class="wrap">
    <div class="cs-hero reveal"><p class="eyebrow">My works</p><h1 class="h2-size">Work I'm done so far</h1></div>
    <div class="sk-root reveal">
      <div class="sk-filter-bar">
        <input type="search" id="skSearch" class="sk-search" placeholder="Search work…" aria-label="Search work">
        <div class="sk-filter-group">
          <button type="button" class="sk-filter-pill" id="skCategoryBtn" aria-expanded="false" aria-haspopup="true">
            <span id="skCategoryLabel">Category</span><span class="sk-filter-caret">⌄</span>
          </button>
          <div class="sk-filter-popover" id="skCategoryPopover" hidden></div>
        </div>
      </div>
      <div class="sk-active-row">
        <button type="button" class="sk-filter-clear" id="skFilterClear" hidden>✕ Clear all</button>
        <div class="sk-active-filters" id="skActiveFilters"></div>
      </div>
      <div class="sk-shelf" id="skShelf"></div>
      <div class="sk-empty" id="skEmpty">
        <svg class="sk-empty-icon" width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="17" cy="17" r="11" stroke="currentColor" stroke-width="2"/>
          <line x1="25.2" y1="25.2" x2="34" y2="34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12.5" y1="17" x2="21.5" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <p>No projects match that search.</p>
      </div>
      <div class="pg-bar" id="skPgBar">
        <label class="pg-size"><span>Show</span>
          <select id="skPerPage" aria-label="Items per page">
            <option value="2">2</option>
            <option value="4">4</option>
            <option value="8">8</option>
            <option value="16">16</option>
          </select>
        </label>
        <nav class="pg-pagination" id="skPagination" aria-label="Pagination" hidden></nav>
      </div>
    </div>
  </main>
  <footer class="site-foot"><div class="wrap"><span>© <span id="yr"></span> Soumya Ranjan Harichandan</span><span id="lastUpdated"></span><span>Designed &amp; built by me</span></div></footer>
  <script src="script.js"></script>
  <script>
    (function () {
      const shelf = document.getElementById('skShelf');
      const searchEl = document.getElementById('skSearch');
      const emptyEl = document.getElementById('skEmpty');
      const catBtn = document.getElementById('skCategoryBtn');
      const catLabel = document.getElementById('skCategoryLabel');
      const catPopover = document.getElementById('skCategoryPopover');
      const clearBtn = document.getElementById('skFilterClear');
      const activeFiltersEl = document.getElementById('skActiveFilters');
      if (!shelf || !searchEl || !catBtn || !catPopover) return;
      const cells = [...shelf.querySelectorAll('.sk-cell')];
      const tagSet = new Set();
      cells.forEach(c => (c.dataset.tags || '').split(',').filter(Boolean).forEach(t => tagSet.add(t)));
      const SUBSTAGES = {
        "By UX Phase": [
          "Research & Discovery",
          "Definition",
          "Ideation & Architecture",
          "Prototyping",
          "Testing & Validation",
          "Implementation & Handoff",
          "Design QA"
        ],
        "By Product Architecture": [
          "Core Foundation / Ecosystem UX (Platform level)",
          "Domain / Business Unit UX (Pillar level)"
        ],
        "By Persona Level": [
          "Strategic Level (Executive / Decision Makers)",
          "Managerial Level (Supervisors / Admins)",
          "Operational Level (End-Users / Power Users)"
        ],
        "Enterprise Industry Types": [
          "B2B SaaS",
          "FinTech",
          "Healthcare & HealthTech",
          "Energy, Oil & Gas",
          "Education Technology (EdTech)",
          "Logistics & Supply Chain",
          "Manufacturing & Industrial IoT",
          "Media & Entertainment"
        ],
        "Business Model Type": [
          "B2B",
          "B2C",
          "D2C"
        ],
        "Enterprise Technology Types": [
          "AI/ML",
          "Cloud Computing",
          "Cybersecurity",
          "Blockchain",
          "IoT",
          "Big Data",
          "AR/VR/MR",
          "Web3"
        ]
      };
      const selectedTags = new Set();
      const selectedSubstages = new Set();
      const openMoreGroups = new Set();
      const pgBar = document.getElementById('skPgBar');
      const perPageSelect = document.getElementById('skPerPage');
      const PP_KEY = 'pgPerPage:work';
      let PER_PAGE = 2;
      try { const saved = parseInt(localStorage.getItem(PP_KEY), 10); if (saved) PER_PAGE = saved; } catch (e) {}
      if (perPageSelect) {
        perPageSelect.value = String(PER_PAGE);
        perPageSelect.addEventListener('change', () => {
          PER_PAGE = parseInt(perPageSelect.value, 10) || PER_PAGE;
          try { localStorage.setItem(PP_KEY, String(PER_PAGE)); } catch (e) {}
          apply();
        });
      }
      const pagination = skPagination(document.getElementById('skPagination'), page => {
        const matched = cells.filter(c => !c.classList.contains('sk-hidden'));
        matched.forEach((c, i) => c.classList.toggle('pg-hidden', i < (page - 1) * PER_PAGE || i >= page * PER_PAGE));
      });

      // splits "Short Name (longer explanation)" into its short label and
      // explanatory note, so the short part can be shown everywhere and the
      // fuller wording kept available without taking up space
      function splitLabel(s) {
        const m = s.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
        return m ? { short: m[1], note: m[2] } : { short: s, note: '' };
      }

      function renderPopover() {
        // only the multi-stage categories are shown — flat single-value tags were removed
        catPopover.innerHTML = Object.keys(SUBSTAGES).sort().map(t => {
          const subItems = SUBSTAGES[t].map(s => {
            const { short, note } = splitLabel(s);
            return `
              <label class="sk-filter-option sk-filter-suboption" title="${s}">
                <input type="checkbox" data-sub value="${s}">
                <span>${short}${note ? `<small class="sk-filter-note">${note}</small>` : ''}</span>
              </label>
            `;
          }).join('');
          return `
            <div class="sk-filter-group-item">
              <button type="button" class="sk-filter-option sk-filter-group-toggle" data-group="${t}">
                <span>${t}</span><span class="sk-filter-caret">⌄</span>
              </button>
              <div class="sk-filter-subgroup" data-group-panel="${t}" hidden>${subItems}</div>
            </div>
          `;
        }).join('');
      }

      function updateLabel() {
        const total = selectedTags.size + selectedSubstages.size;
        if (total === 0) {
          catLabel.textContent = 'Category';
        } else if (total === 1) {
          const only = [...selectedTags, ...selectedSubstages][0];
          catLabel.textContent = splitLabel(only).short;
        } else {
          catLabel.textContent = `Category (${total})`;
        }
        catBtn.classList.toggle('active', total > 0);
      }

      function groupOf(substageValue) {
        return Object.keys(SUBSTAGES).find(g => SUBSTAGES[g].includes(substageValue)) || '';
      }

      function renderActiveFilters() {
        if (!activeFiltersEl) return;

        // group selected substages by their parent category
        const byGroup = {};
        selectedSubstages.forEach(v => {
          const g = groupOf(v);
          (byGroup[g] = byGroup[g] || []).push(v);
        });

        const groupChips = Object.keys(byGroup).map(g => {
          const values = byGroup[g];
          const first = values[0];
          const rest = values.slice(1);

          const label = `<span class="sk-active-group-label">${g}:</span>`;
          const chipFor = v => {
            const short = splitLabel(v).short;
            return `
              <span class="sk-active-subchip" title="${v}">
                ${short}<button type="button" class="sk-active-chip-x" data-remove-sub="${v}" aria-label="Remove ${v}">✕</button>
              </span>
            `;
          };

          if (rest.length === 0) {
            return `<span class="sk-active-chip-group">${label}${chipFor(first)}</span>`;
          }

          const open = openMoreGroups.has(g);
          const subPills = rest.map(chipFor).join('');

          return `
            <span class="sk-active-chip-group">
              ${label}
              ${chipFor(first)}
              <button type="button" class="sk-more-btn${open ? ' active' : ''}" data-more-group="${g}">
                +${rest.length} more<span class="sk-active-chip-caret">${open ? '⌃' : '⌄'}</span>
              </button>
              <div class="sk-more-dropdown" data-more-panel="${g}" ${open ? '' : 'hidden'}>
                <p class="sk-more-title">More filters</p>
                ${subPills}
              </div>
            </span>
          `;
        });

        const tagChips = [...selectedTags].map(v => `
          <button type="button" class="sk-active-chip" data-remove="${v}" data-sub="false">
            ${v}<span class="sk-active-chip-x">✕</span>
          </button>
        `);

        activeFiltersEl.innerHTML = [...groupChips, ...tagChips].join('');
      }

      function removeFilter(value, isSub) {
        const set = isSub ? selectedSubstages : selectedTags;
        set.delete(value);
        const cb = catPopover.querySelector(
          isSub ? `input[data-sub][value="${CSS.escape(value)}"]` : `input[value="${CSS.escape(value)}"]:not([data-sub])`
        );
        if (cb) cb.checked = false;
        updateLabel();
        renderActiveFilters();
        apply();
      }

      function apply() {
        const term = searchEl.value.trim().toLowerCase();
        let visible = 0;
        cells.forEach(c => {
          const title = (c.dataset.title || '').toLowerCase();
          const kick = (c.dataset.kick || '').toLowerCase();
          const tags = (c.dataset.tags || '').split(',');
          const substages = (c.dataset.substages || '').split('|').filter(Boolean);
          const matchesTerm = !term || title.includes(term) || kick.includes(term);
          const matchesTag = selectedTags.size === 0 || tags.some(t => selectedTags.has(t));
          const matchesSub = selectedSubstages.size === 0 || substages.some(s => selectedSubstages.has(s));
          const show = matchesTerm && matchesTag && matchesSub;
          c.classList.toggle('sk-hidden', !show);
          if (show) visible++;
        });
        emptyEl.classList.toggle('show', visible === 0);
        shelf.classList.toggle('sk-shelf-hidden', visible === 0);
        clearBtn.hidden = term === '' && selectedTags.size === 0 && selectedSubstages.size === 0;
        if (pgBar) pgBar.hidden = visible === 0;
        pagination.setCount(visible, PER_PAGE);
      }

      function openPopover() {
        catPopover.hidden = false;
        catBtn.setAttribute('aria-expanded', 'true');
      }
      function closePopover() {
        catPopover.hidden = true;
        catBtn.setAttribute('aria-expanded', 'false');
      }

      catBtn.addEventListener('click', e => {
        e.stopPropagation();
        catPopover.hidden ? openPopover() : closePopover();
      });
      catPopover.addEventListener('click', e => {
        e.stopPropagation();
        const groupToggle = e.target.closest('.sk-filter-group-toggle');
        if (groupToggle) {
          const panel = catPopover.querySelector(`[data-group-panel="${groupToggle.dataset.group}"]`);
          const willOpen = panel && panel.hidden;
          // accordion: only one sub-category group open at a time
          catPopover.querySelectorAll('.sk-filter-subgroup').forEach(p => { p.hidden = true; });
          catPopover.querySelectorAll('.sk-filter-group-toggle').forEach(b => b.classList.remove('expanded'));
          if (panel && willOpen) {
            panel.hidden = false;
            groupToggle.classList.add('expanded');
          }
        }
      });
      catPopover.addEventListener('change', e => {
        const cb = e.target;
        if (cb.type !== 'checkbox') return;
        const set = cb.hasAttribute('data-sub') ? selectedSubstages : selectedTags;
        cb.checked ? set.add(cb.value) : set.delete(cb.value);
        updateLabel();
        renderActiveFilters();
        apply();
      });
      function closeMoreDropdowns() {
        if (openMoreGroups.size === 0) return;
        openMoreGroups.clear();
        renderActiveFilters();
      }

      activeFiltersEl && activeFiltersEl.addEventListener('click', e => {
        e.stopPropagation();
        const removeSubTarget = e.target.closest('[data-remove-sub]');
        if (removeSubTarget) {
          removeFilter(removeSubTarget.dataset.removeSub, true);
          return;
        }
        const moreBtn = e.target.closest('.sk-more-btn');
        if (moreBtn) {
          const g = moreBtn.dataset.moreGroup;
          openMoreGroups.has(g) ? openMoreGroups.delete(g) : (openMoreGroups.clear(), openMoreGroups.add(g));
          renderActiveFilters();
          return;
        }
        const simpleChip = e.target.closest('.sk-active-chip[data-remove]');
        if (simpleChip) {
          removeFilter(simpleChip.dataset.remove, simpleChip.dataset.sub === 'true');
        }
      });
      document.addEventListener('click', () => { closePopover(); closeMoreDropdowns(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePopover(); closeMoreDropdowns(); } });

      clearBtn.addEventListener('click', () => {
        selectedTags.clear();
        selectedSubstages.clear();
        openMoreGroups.clear();
        searchEl.value = '';
        catPopover.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        updateLabel();
        renderActiveFilters();
        apply();
      });
      searchEl.addEventListener('input', apply);

      renderPopover();
      updateLabel();
      renderActiveFilters();
      apply();
    })();
  </script>
</body>
