<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work — Soumya Ranjan Harichandan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a href="index.html" class="logo">Soumya <span>Harichandan</span></a>
      <nav>
        <a href="work.html">Work</a>
        <a href="notes.html">Notebooks</a>
        <a href="about.html">About</a>
        <a href="index.html#contact">Contact</a>
        <button id="theme" aria-label="Toggle theme">☾</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="cs-hero cs-hero--compact reveal"><p class="eyebrow">My works</p></div>
    <div class="sk-root reveal" style="padding-bottom:96px">
      <div class="sk-filter-bar">
        <input type="search" id="skSearch" class="sk-search" placeholder="Search work…" aria-label="Search work">
        <div class="sk-filter-group">
          <button type="button" class="sk-filter-pill" id="skCategoryBtn" aria-expanded="false" aria-haspopup="true">
            <span id="skCategoryLabel">Category</span><span class="sk-filter-caret">⌄</span>
          </button>
          <div class="sk-filter-popover" id="skCategoryPopover" hidden></div>
        </div>
        <button type="button" class="sk-filter-clear" id="skFilterClear" hidden>✕ Clear all</button>
      </div>
      <div class="sk-shelf" id="skShelf"></div>
      <p class="sk-empty" id="skEmpty">No projects match that search.</p>
    </div>
  </main>
  <footer class="site-foot"><div class="wrap"><span>© <span id="yr"></span> Soumya Ranjan Harichandan</span><span>Designed &amp; built by me</span></div></footer>
  <script src="script.js"></script>
  <script>
    (function () {
      const shelf = document.getElementById('skShelf');
      const searchEl = document.getElementById('skSearch');
      const emptyEl = document.getElementById('skEmpty');
      const catBtn = document.getElementById('skCategoryBtn');
      const catLabel = document.getElementById('skCategoryLabel');
      const catPopover = document.getElementById('skCategoryPopover');
      const clearBtn = document.getElementById('skFilterClear');
      if (!shelf || !searchEl || !catBtn || !catPopover) return;
      const cells = [...shelf.querySelectorAll('.sk-cell')];
      const tagSet = new Set();
      cells.forEach(c => (c.dataset.tags || '').split(',').filter(Boolean).forEach(t => tagSet.add(t)));
      const selectedTags = new Set();

      function renderPopover() {
        catPopover.innerHTML = [...tagSet].sort().map(t => `
          <label class="sk-filter-option">
            <input type="checkbox" value="${t}">
            <span>${t}</span>
          </label>
        `).join('');
      }

      function updateLabel() {
        if (selectedTags.size === 0) {
          catLabel.textContent = 'Category';
        } else if (selectedTags.size === 1) {
          catLabel.textContent = [...selectedTags][0];
        } else {
          catLabel.textContent = `Category (${selectedTags.size})`;
        }
        catBtn.classList.toggle('active', selectedTags.size > 0);
      }

      function apply() {
        const term = searchEl.value.trim().toLowerCase();
        let visible = 0;
        cells.forEach(c => {
          const title = (c.dataset.title || '').toLowerCase();
          const kick = (c.dataset.kick || '').toLowerCase();
          const tags = (c.dataset.tags || '').split(',');
          const matchesTerm = !term || title.includes(term) || kick.includes(term);
          const matchesTag = selectedTags.size === 0 || tags.some(t => selectedTags.has(t));
          const show = matchesTerm && matchesTag;
          c.classList.toggle('sk-hidden', !show);
          if (show) visible++;
        });
        emptyEl.classList.toggle('show', visible === 0);
        clearBtn.hidden = term === '' && selectedTags.size === 0;
      }

      function openPopover() {
        catPopover.hidden = false;
        catBtn.setAttribute('aria-expanded', 'true');
      }
      function closePopover() {
        catPopover.hidden = true;
        catBtn.setAttribute('aria-expanded', 'false');
      }

      catBtn.addEventListener('click', e => {
        e.stopPropagation();
        catPopover.hidden ? openPopover() : closePopover();
      });
      catPopover.addEventListener('click', e => e.stopPropagation());
      catPopover.addEventListener('change', e => {
        const cb = e.target;
        if (cb.type !== 'checkbox') return;
        cb.checked ? selectedTags.add(cb.value) : selectedTags.delete(cb.value);
        updateLabel();
        apply();
      });
      document.addEventListener('click', () => closePopover());
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopover(); });

      clearBtn.addEventListener('click', () => {
        selectedTags.clear();
        searchEl.value = '';
        catPopover.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        updateLabel();
        apply();
      });
      searchEl.addEventListener('input', apply);

      renderPopover();
      updateLabel();
      apply();
    })();
  </script>
</body>
</html>
